name: 'publish'

# Fires on a version tag (e.g. `git tag v0.2.0 && git push --tags`) and builds
# both platforms this app targets (see AGENTS.md — no macOS, no cross-compiling).
# Linux builds on 22.04 rather than -latest on purpose: the AppImage links
# against that runner's glibc, and building on a newer Ubuntu produces an
# AppImage that refuses to run on older ones.
on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install frontend dependencies
        run: npm install

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Fluxel2 ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install this version.'
          # Published outright rather than left as a draft, so pushing a tag is
          # the whole release. Both matrix jobs attach to this same release, so
          # for the few minutes between them it is public with only the faster
          # platform's installers on it — the trade for having no manual step.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
