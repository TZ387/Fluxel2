[package]
name = "fluxel2"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fluxel2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

# `tauri dev` always builds the `dev` profile, which by default has all
# optimizations off — fine for typical Tauri apps, but the physics loops in
# src/physics/ are genuinely numeric hot paths (exp/sqrt/tanh per voxel) and
# are 20-50x slower unoptimized than they need to be. Debug assertions/
# overflow checks stay on for safety during development; this only affects
# codegen quality.
[profile.dev]
opt-level = 3

