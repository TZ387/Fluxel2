<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Light Diffusion Simulator</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div class="app-shell">
      <h1>Light Diffusion Simulator</h1>
      <p class="subtitle">Steady-state light transport in layered tissue</p>

      <!-- ── tabs ──────────────────────────────────────────────────── -->
      <div class="tab-bar">
        <button type="button" class="tab-btn active" id="tab-btn-simulator">Simulator</button>
        <button type="button" class="tab-btn" id="tab-btn-help">Help</button>
      </div>

      <div id="tab-simulator">
        <!-- ── parameter panel ─────────────────────────────────────── -->
        <div class="panel">
          <div class="panel-title">Model</div>
          <div class="param-row" style="max-width: 820px">
            <select id="model-select" class="model-select"></select>
          </div>
        </div>

        <!-- Each model declares its own paramGroups (models.ts); this
             container is torn down and rebuilt whenever the model changes,
             so it stays empty in markup. -->
        <div id="param-panels"></div>

        <div class="panel">
          <div class="run-row">
            <button id="run-btn">&#9654; Compute &amp; visualise</button>
            <!-- The parameters above, layer names included, plus the shared
                 view controls — as a JSON file. See src/settings.ts for the
                 shape and what it does and doesn't remember. -->
            <button type="button" class="io-btn" id="save-btn">Save settings&hellip;</button>
            <button type="button" class="io-btn" id="load-btn">Load settings&hellip;</button>
          </div>
          <div id="status">Adjust parameters and click Compute.</div>
        </div>

        <!-- ── plots ───────────────────────────────────────────────── -->
        <div id="plots" style="display: none">
          <!-- Shared by both plots: the camera is common so that fluence and
               absorption stay directly comparable, and so are the scale and
               colormap for the same reason. -->
          <div class="panel view-panel">
            <div class="panel-title">View</div>
            <div class="view-row">
              <label
                >Layout
                <select id="view-mode">
                  <option value="box3d">3-D slice box</option>
                  <option value="flat">Flat slices</option>
                </select>
              </label>
              <label
                >Colour scale
                <select id="view-scale">
                  <option value="log">Logarithmic</option>
                  <option value="linear">Linear</option>
                </select>
              </label>
              <label
                >Colormap
                <select id="view-cmap"></select>
              </label>
              <span class="view-hint" id="view-hint">Drag a plot to orbit &middot; double-click to reset the angle</span>
            </div>
          </div>

          <div class="plots-row">
            <div class="plot-panel">
              <div class="plot-title">Fluence &Phi; [W/cm&sup2;]</div>
              <div class="canvas-wrap">
                <canvas class="main" id="cv-phi"></canvas>
                <!-- Follows the cursor over the plot; positioned and filled by
                     main.ts, which is also what hides it when the cursor is
                     off the slices. -->
                <div class="hover-readout" id="hov-phi" hidden></div>
              </div>
              <div class="axis-sliders" id="sl-phi"></div>
              <button type="button" class="io-btn" id="export-phi-btn">Export plot&hellip;</button>
              <button type="button" class="io-btn" id="export-phi-data-btn">Export data&hellip;</button>
              <!-- Label text and legend words come from the selected model's
                   `overlay` (models.ts) — what the overlay grades differs by
                   model, so it can't be written here. -->
              <label class="validity-toggle" id="vtoggle-phi" hidden>
                <input type="checkbox" id="vchk-phi" /> <span id="vlbl-phi"></span>
              </label>
              <div class="cbar-row">
                <!-- Ticks and their numbers are drawn into the canvas, since how
                     many there are and where they sit follows the scale. -->
                <canvas class="cbar-canvas" id="cbar-phi"></canvas>
              </div>
            </div>

            <div class="plot-panel">
              <div class="plot-title">Absorption A = &mu;<sub>a</sub> &middot; &Phi; [W/cm&sup3;]</div>
              <div class="canvas-wrap">
                <canvas class="main" id="cv-abs"></canvas>
                <!-- Follows the cursor over the plot; positioned and filled by
                     main.ts, which is also what hides it when the cursor is
                     off the slices. -->
                <div class="hover-readout" id="hov-abs" hidden></div>
              </div>
              <div class="axis-sliders" id="sl-abs"></div>
              <button type="button" class="io-btn" id="export-abs-btn">Export plot&hellip;</button>
              <button type="button" class="io-btn" id="export-abs-data-btn">Export data&hellip;</button>
              <label class="validity-toggle" id="vtoggle-abs" hidden>
                <input type="checkbox" id="vchk-abs" /> <span id="vlbl-abs"></span>
              </label>
              <div class="cbar-row">
                <!-- Ticks and their numbers are drawn into the canvas, since how
                     many there are and where they sit follows the scale. -->
                <canvas class="cbar-canvas" id="cbar-abs"></canvas>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Populated once from help.ts — general usage plus one section per
           model in models.ts (equations, use cases, limits, reference). -->
      <div id="tab-help" style="display: none"></div>
    </div>
    <!-- /.app-shell -->
  </body>
</html>
